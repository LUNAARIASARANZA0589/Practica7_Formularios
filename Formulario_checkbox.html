<!DOCTYPE html>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
<style>
    body{
        font-family: Arial, sans-serif;
    }
</style>
</head>
<body>
    <h2 align="center">Formularios con Checkbox</h2>
    <form action="" method="post">
    <!--Aquí se indica que vamos a tener un formulario, no tiene ninguna acción debido a que no está ligada a ninguna base de datos, con el método post que significa enviar-->     
    Ingresa tu nombre:
    <input type="text" name="nombre">
    <!--Aquí tenemos un input de variable de texto, donde se va a almacenar el nombre de quién responde el formulario.-->
    <br>
    Selecciona los lenguajes que conozcas:
    <br>
    <input type="checkbox" name="Java">Java <br>
    <input type="checkbox" name="Python"> Python <br>
    <input type="checkbox" name="C#">C# <br>
    <input type="checkbox" name="Flutter"> Flutter <br>
    <!--Aquí tenemos un input dde opción múltiple, cada uno corresponde al mismo tipo pero el nombre cambia para cada opción.-->
    </form>

</body>
</html>
