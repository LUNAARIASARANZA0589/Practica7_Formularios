<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios con Comentarios</title>

<!--Luna Arias Meredith Aranza — 0589 — 5-I -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
<style>
    body{
        font-family: Arial, sans-serif;
    }
</style>
</head>
<body>
    <h2 align="center"> Formulario con Comentarios </h2>
    <form action="" method="post">
    <!--Aquí se indica que vamos a tener un formulario, no tiene ninguna acción debido a que no está ligada a ninguna base de datos, con el método post que significa enviar--> 
    Ingresa tu nombre:
    <input type="text" name="Nombre">
    <!--Aquí tenemos un input de variable de texto, donde se va a almacenar el nombre de quién responde el formulario.-->
    <br>
    Ingresa tu correo:
    <input type="email" name="Correo">
    <!--Aquí tenemos un input de variable de texto, donde se va a almacenar el email de quién responde el formulario.-->
    <br>
    Ingresa tus comentarios:
    <textarea name="Comentarios" rows="1" cols="10"></textarea>
    <!--Aquí tenemos un nuevo tipo de input, que es la etiqueta de textarea, nos indica que el usuario puede escribir todo lo que quiera dentro del recuadro específicado.-->
    <br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Borrar">
    <!--Aquí tenemos los botones para realizar las acciones de enviar (submit) y eliminar (reset).-->
    </form>

</body>
</html>
