<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios con Contraseña</title>

<!--Luna Arias Meredith Aranza — 0589 — 5-I -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
<style>
    body{
        font-family: Arial, sans-serif;
    }
</style>
</head>
<body>
    <h2>Formulario para contraseñas</h2>
    <form action="" method="post">
    <!--Aquí se indica que vamos a tener un formulario, no tiene ninguna acción debido a que no está ligada a ninguna base de datos, con el método post que significa enviar-->   
    Ingresa tu usuario:
    <input type="text" name="usuario">
    <!--Aquí tenemos un input de variable de texto, donde se va a almacenar el usuario de quién responde el formulario.-->
    Ingresa tu contraseña:
    <input type="password" name="pass">
    <!--Aquí tenemos un input de variable de contraseña, donde se va a almacenar la contraseña que se añada al formulario.-->
    <br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Borrar">
    <!--Aquí tenemos los botones para realizar las acciones de enviar (submit) y eliminar (reset).-->
    </form>

</body>
</html>
