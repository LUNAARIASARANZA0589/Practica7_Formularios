<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios con Selección</title>

<!--Luna Arias Meredith Aranza — 0589 — 5-I -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
<style>
    body{
        font-family: Arial, sans-serif;
    }
</style>
</head>
<body>
    <h2>Formularios con Selección</h2>
  <form action="" method="post">
  Ingresa tu nombre:
  <input type="text" name="nombre">
  <!--Aquí se indica que vamos a tener un formulario, no tiene ninguna acción debido a que no está ligada a ninguna base de datos, con el método post que significa enviar-->
  <br>
  Selecciona tu pais:
  <select name="pais">
  <option value="1">Argentina</option>
  <option value="2">España</option>
  <option value="3">Mexico</option>
  <option value="4">Guatemala</option>
  <option value="5">Honduras</option>
  <option value="6">El Salvador</option>
  <option value="7">Venezuela</option>
  <option value="8">Colombia</option>
  </select>
  <!--Aquí tenemos un input de opción múltiple utilizando SELECT, que permite tener varias opciones con un valor respectivo, cada uno corresponde a un número cambia para cada opción.-->
  <br>
  <input type="submit" value="Enviar">
  <input type="reset" value="Borrar">
  <!--Aquí tenemos los botones para realizar las acciones de enviar (submit) y eliminar (reset).-->
  </form>

</body>
</html>
