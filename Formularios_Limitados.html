<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios con Limitaciones</title>

<!--Luna Arias Meredith Aranza — 0589 — 5-I -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
<style>
    body{
        font-family: Arial, sans-serif;
    }
</style>
</head>
<body>
    <h2 align="center"> Formulario con Limitaciones </h2>
  <form action="" method="post">
  <!--Aquí se indica que vamos a tener un formulario, no tiene ninguna acción debido a que no está ligada a ninguna base de datos, con el método post que significa enviar-->
   Ingresa tu nombre:
<!-- Desahbilitacion de campo -->
<input type="text" name="nombre" disabled><br>
<!--Aquí tenemos un input de variable de texto, donde se va a almacenar el nombre de quién responde el formulario.-->
<!-- Limitacion de caracteres mediante maxlenght a solo 5 caracteres. -->
Contraseña:
<input type="password" name="pass" maxlength="5"><br>
<!-- Solo lectura -->
<!--Aquí tenemos un atributo llamado readonly, que no permite editar lo que esta dentro de ello.-->
Comentarios:
<textarea name="comentarios" readonly>
Este es mi comentario y no se puede borrar
</textarea><br>
</form>
</body>
</html>
